[workspace]
members = [
    "crates/kclip-cli",
    "crates/kclip-config",
    "crates/kclip-crypto",
    "crates/kclip-daemon",
    "crates/kclip-protocol",
    "crates/kclip-storage",
    "crates/kclip-sync",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.22.1"
bip39 = "2.2.0"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.40", features = ["derive"] }
futures-util = "0.3.31"
getrandom = "0.3.3"
libc = "0.2.174"
rpassword = "7.4.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_bytes = "0.11.17"
serde_cbor = "0.11.2"
serde_json = "1.0.140"
sha2 = "0.10.9"
snow = "0.10.0"
tempfile = "3.20.0"
thiserror = "1.0.69"
tokio = { version = "1.46.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "0.9.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.17.0", features = ["v4"] }
url = "2.5.4"
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }
